name: 🚀 Deploy TEST Stage backup-wp-plugin

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Backup Plugin — CI"]
    branches: ["feature/**"]
    types: [completed]

jobs:
  web-deploy:
    name: 🎉 Deploy at https://spielwiese.erfindergeist.org/
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'

    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v6
      with:
        ref: ${{ github.event.workflow_run.head_sha }}

    - name: 🐘 Setup PHP & Composer
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.3'
        tools: composer
        coverage: none

    - name: 📦 Install runtime dependencies
      run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

    - name: 📂 Sync files
      uses: ./.github/actions/ftp-deploy
      with:
        username: ${{ secrets.FTP_USERNAME_TEST }}
        password: ${{ secrets.FTP_PASSWORD_TEST }}
